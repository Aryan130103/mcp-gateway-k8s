apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
spec:
{{- with .Values.ingressClassName }}
  ingressClassName: {{ . | quote }}
{{- end }}
  rules:
    - host: {{ .Values.wordpress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
