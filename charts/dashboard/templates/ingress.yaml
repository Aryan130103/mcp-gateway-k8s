apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
spec:
{{- with .Values.ingressClassName }}
  ingressClassName: {{ . | quote }}
{{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.gateway.service }}
                port:
                  number: {{ .Values.gateway.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 8080
