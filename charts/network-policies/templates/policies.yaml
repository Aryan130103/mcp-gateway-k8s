apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mariadb-from-wordpress-and-setup
spec:
  podSelector:
    matchLabels: {app: mariadb}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: wordpress}}
        - podSelector: {matchLabels: {job-name: store-setup}}
      ports: [{port: 3306}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wordpress-from-woo-mcp-and-ingress
spec:
  podSelector:
    matchLabels: {app: wordpress}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: woo-mcp}}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-servers-from-gateway-only
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [woo-mcp, notes-mcp, utility-mcp]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-and-dashboard-from-ingress
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [gateway, dashboard]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 8080}]
